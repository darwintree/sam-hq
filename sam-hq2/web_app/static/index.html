<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HQ-SAM2 Background Remover</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <h1>HQ-SAM2 背景抠除 Demo</h1>
          <p class="hint">
            上传图片后，可用点或框指定主体，绿色为前景、红色为背景。
          </p>
        </div>
        <div class="hero-tip">
          <span class="pill">操作提示</span>
          <p>滚轮缩放；按住 Shift/中键拖动平移，右键也可平移。</p>
        </div>
      </header>

      <div class="layout">
      <section class="card workspace">
        <div class="card-header">
          <h2>操作与标注</h2>
          <p>先上传图片，再点选前景/背景或框选。</p>
        </div>
        <div class="workspace-body">
          <div class="workspace-controls">
            <label class="file-picker">
              <span>选择图片</span>
              <input type="file" id="fileInput" accept="image/*" />
            </label>
            <div class="control-group">
              <div class="group-title">标注模式</div>
              <div class="segmented">
                <button id="foregroundBtn" type="button" class="active" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <polyline points="9 12 11 14 15 10"></polyline>
                  </svg>
                  保留点
                </button>
                <button id="backgroundBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                  </svg>
                  排除点
                </button>
                <button id="boxBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                  </svg>
                  框选
                </button>
              </div>
            </div>
            <div class="control-group">
              <div class="group-title">编辑</div>
              <div class="button-row">
                <button id="undoBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="9 7 3 7 3 13"></polyline>
                    <path d="M21 17a9 9 0 0 0-9-9H3"></path>
                  </svg>
                  撤销
                </button>
                <button id="redoBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="15 7 21 7 21 13"></polyline>
                    <path d="M3 17a9 9 0 0 1 9-9h9"></path>
                  </svg>
                  重做
                </button>
                <button id="deleteBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="3 6 21 6"></polyline>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M6 6l1 14h10l1-14"></path>
                  </svg>
                  删除选中点
                </button>
                <button id="clearBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="9" y1="12" x2="15" y2="12"></line>
                  </svg>
                  清除所有点
                </button>
                <button id="clearAllBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="8" y1="8" x2="16" y2="16"></line>
                  </svg>
                  清除点和框
                </button>
                <button id="clearBoxBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                    <line x1="8" y1="8" x2="16" y2="16"></line>
                    <line x1="16" y1="8" x2="8" y2="16"></line>
                  </svg>
                  清除框
                </button>
              </div>
            </div>
            <div class="control-group">
              <div class="group-title">视图</div>
              <div class="button-row">
                <button id="resetViewBtn" type="button" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-3.3-7.1"></path>
                    <polyline points="21 3 21 9 15 9"></polyline>
                  </svg>
                  重置视图
                </button>
                <span id="zoomLabel">100%</span>
              </div>
            </div>
            <button id="processBtn" class="primary" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path>
              </svg>
              生成透明 PNG
            </button>
            <p class="status" id="status">等待图片...</p>
          </div>
          <div class="workspace-canvas">
            <p class="subtle">
              点击添加点；拖动点可微调；框选用于快速圈定主体范围。
              绿色=保留，红色=排除。
            </p>
            <div class="canvas-wrap">
              <canvas id="imageCanvas"></canvas>
            </div>
            <label class="toggle">
              <input type="checkbox" id="maskToggle" checked disabled />
              显示遮罩预览
            </label>
            <label class="range">
              透明度
              <input
                type="range"
                id="maskOpacity"
                min="0"
                max="1"
                step="0.05"
                value="0.6"
                disabled
              />
            </label>
          </div>
        </div>
      </section>

      <section class="card result">
        <h2>结果预览</h2>
        <div class="result-placeholder" id="resultPlaceholder">
          结果会在此显示，支持下载透明 PNG。
        </div>
        <img id="resultImage" alt="输出 PNG" />
        <a id="downloadLink" download="output.png">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12"></path>
            <polyline points="7 11 12 16 17 11"></polyline>
            <path d="M5 19h14"></path>
          </svg>
          下载 PNG
        </a>
      </section>
      </div>
    </main>

    <script defer src="/static/app.js"></script>
  </body>
</html>
