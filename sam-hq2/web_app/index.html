<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HQ-SAM2 Background Remover</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, sans-serif;
      }
      body {
        margin: 24px;
        background: #f7f7fb;
        color: #1f1f2e;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 8px;
      }
      .layout {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
        align-items: start;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
      }
      .controls {
        display: grid;
        gap: 12px;
      }
      button {
        background: #1e3a8a;
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .canvas-wrap {
        border: 1px dashed #cbd5f5;
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }
      canvas {
        max-width: 100%;
        border-radius: 8px;
      }
      .status {
        font-size: 0.9rem;
        color: #475569;
      }
      .result img {
        max-width: 100%;
        border-radius: 12px;
        background: repeating-conic-gradient(#f1f5f9 0% 25%, #e2e8f0 0% 50%)
          50% / 20px 20px;
      }
      .hint {
        font-size: 0.9rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <h1>HQ-SAM2 背景抠除 Demo</h1>
    <p class="hint">上传图片后，在主体上点击一次作为提示点。</p>

    <div class="layout">
      <section class="card controls">
        <label>
          选择图片
          <input type="file" id="fileInput" accept="image/*" />
        </label>
        <button id="processBtn" disabled>生成透明 PNG</button>
        <p class="status" id="status">等待图片...</p>
      </section>

      <section class="card">
        <h3>点击主体位置</h3>
        <div class="canvas-wrap">
          <canvas id="imageCanvas"></canvas>
        </div>
      </section>

      <section class="card result">
        <h3>结果预览</h3>
        <img id="resultImage" alt="输出 PNG" />
        <a id="downloadLink" download="output.png">下载 PNG</a>
      </section>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const canvas = document.getElementById("imageCanvas");
      const ctx = canvas.getContext("2d");
      const processBtn = document.getElementById("processBtn");
      const status = document.getElementById("status");
      const resultImage = document.getElementById("resultImage");
      const downloadLink = document.getElementById("downloadLink");

      let currentImage = null;
      let clickPoint = null;
      let scaleFactor = 1;

      function drawImage() {
        if (!currentImage) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }
        const maxWidth = 600;
        const ratio = currentImage.naturalWidth / currentImage.naturalHeight;
        const width = Math.min(maxWidth, currentImage.naturalWidth);
        const height = Math.round(width / ratio);
        canvas.width = width;
        canvas.height = height;
        scaleFactor = currentImage.naturalWidth / width;
        ctx.drawImage(currentImage, 0, 0, width, height);
        if (clickPoint) {
          ctx.beginPath();
          ctx.arc(clickPoint.displayX, clickPoint.displayY, 6, 0, Math.PI * 2);
          ctx.fillStyle = "#ef4444";
          ctx.fill();
          ctx.strokeStyle = "white";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          clickPoint = null;
          drawImage();
          status.textContent = "请在主体上点击";
          processBtn.disabled = true;
        };
        img.src = URL.createObjectURL(file);
      });

      canvas.addEventListener("click", (event) => {
        if (!currentImage) return;
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        clickPoint = {
          displayX: x,
          displayY: y,
          originalX: x * scaleFactor,
          originalY: y * scaleFactor,
        };
        drawImage();
        processBtn.disabled = false;
        status.textContent = "已选择主体点，点击生成";
      });

      processBtn.addEventListener("click", async () => {
        const file = fileInput.files[0];
        if (!file || !clickPoint) return;
        processBtn.disabled = true;
        status.textContent = "正在处理...";
        const formData = new FormData();
        formData.append("image", file);
        formData.append("point_x", clickPoint.originalX.toFixed(2));
        formData.append("point_y", clickPoint.originalY.toFixed(2));

        try {
          const response = await fetch("/api/segment", {
            method: "POST",
            body: formData,
          });
          if (!response.ok) {
            const detail = await response.text();
            throw new Error(detail || "服务器出错");
          }
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          resultImage.src = url;
          downloadLink.href = url;
          status.textContent = "完成";
        } catch (error) {
          status.textContent = `处理失败：${error.message}`;
        } finally {
          processBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
